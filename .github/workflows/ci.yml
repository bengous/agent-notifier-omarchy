name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  widget-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update
      - run: sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qttest
      - run: tests/qml/run.sh

  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-modules --locked
      # --cfg-test: every `mod tests;` sits behind #[cfg(test)], so without it
      # each tests.rs reads as an orphan. Acyclicity is checked in
      # tests/architecture.rs; `cargo modules dependencies --acyclic` reports a
      # false cycle between a type and its own constructor.
      - run: cargo modules orphans --deny --cfg-test
