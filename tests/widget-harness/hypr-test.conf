# The nested output reports no preferred mode: without an explicit one the
# monitor comes up as a 0x0 FALLBACK output and grim captures nothing.
monitor = , 1280x720@60, 0x0, 1

general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
}

decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    disable_autoreload = true
    background_color = 0xff101010
}

debug {
    disable_logs = false
    enable_stdout_logs = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}
